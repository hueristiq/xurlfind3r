name: 🛡️ Vulnerability Scan (CodeQL)

on:
    push:
        branches:
            - "main"
            - "dev"
        paths:
            - '**.go'
            - '**.mod'
            - '**.sum'
            - '.golangci.yaml'
            - '.github/workflows/**'
    pull_request:
        branches:
          - "main"
          - "dev"
        paths:
            - '**.go'
            - '**.mod'
            - '**.sum'
            - '.golangci.yaml'
            - '.github/workflows/**'
    workflow_dispatch:

jobs:
    analyze:
        name: Vulnerability Scan (CodeQL)
        strategy:
            fail-fast: false
            matrix:
                language: [ 'go' ]
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        steps:
            -
                name: Code Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -
                name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: ${{ matrix.language }}
            -
                name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4
