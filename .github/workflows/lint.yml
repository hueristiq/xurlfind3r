name: 💅 Lint

on:
    push:
        branches:
            - "main"
            - "dev"
        paths:
            - '**.go'
            - '**.mod'
            - '**.sum'
            - '.golangci.yaml'
            - '.github/workflows/**'
    pull_request:
        branches:
          - "main"
          - "dev"
        paths:
            - '**.go'
            - '**.mod'
            - '**.sum'
            - '.golangci.yaml'
            - '.github/workflows/**'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            -
                name: Code Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -
                name: Set up Go
                uses: actions/setup-go@v7
                with:
                    go-version-file: go.mod
                    cache: false
            -
                name: Check formatting
                run: make go-fmt-check
                working-directory: .
            -
                name: golangci-lint
                uses: golangci/golangci-lint-action@v9
                with:
                    version: v2.15.0
                    args: --timeout 5m
                    working-directory: .
